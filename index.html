<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Credit Visits</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Credit Visits">
  <meta name="application-name" content="Credit Visits">
  <meta name="theme-color" content="#1e3a8a">

  <link rel="apple-touch-icon" href="./icon-512.png">
  <link rel="icon" type="image/png" href="./icon-512.png">
  <link rel="manifest" href="./manifest.json">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f6f9;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    }
    #splash {
      position: fixed;
      inset: 0;
      background: #1e3a8a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 10;
    }
    #splash img {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      margin-bottom: 14px;
      background: #ffffff;
      padding: 6px;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 14px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #fallbackBtn {
      display: none;
      margin-top: 14px;
      background: #ffffff;
      color: #1e3a8a;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="./icon-192.png" alt="Credit Visits">
    <div style="font-size: 20px; font-weight: 700;">Credit Visits</div>
    <div class="spinner"></div>
    <div id="statusText" style="font-size: 14px; opacity: 0.92;">جاري تحميل التطبيق...</div>
    <a id="fallbackBtn" href="https://script.google.com/macros/s/AKfycby0cyExtj8GlXRIRW91b5KxRXYxJTnNTaw4uzgX1mS7sQq6UZac-k8LAzVBAgx2PW_BYw/exec" target="_blank" rel="noopener">
      فتح التطبيق مباشرة
    </a>
  </div>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycby0cyExtj8GlXRIRW91b5KxRXYxJTnNTaw4uzgX1mS7sQq6UZac-k8LAzVBAgx2PW_BYw/exec"
    allow="geolocation; camera; microphone"
    referrerpolicy="no-referrer-when-downgrade"
    onload="onFrameLoaded()">
  </iframe>

  <script>
    let frameLoaded = false;

    function onFrameLoaded() {
      frameLoaded = true;
      const splash = document.getElementById('splash');
      if (splash) splash.style.display = 'none';
    }

    setTimeout(function() {
      if (!frameLoaded) {
        const statusEl = document.getElementById('statusText');
        const btn = document.getElementById('fallbackBtn');
        if (statusEl) statusEl.innerText = 'التحميل يستغرق وقتاً أطول من المعتاد...';
        if (btn) btn.style.display = 'inline-block';
      }
    }, 6000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function() {});
      });
    }
  </script>
</body>
</html>
